<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akıllı Giriş | EGE Diagnostik</title><link rel="stylesheet" href="/assets/app.css"><style>.auth{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 70% 20%,#d9f7ff,transparent 28%),#f4faff}.authbox{width:min(440px,100%);background:#fff;border:1px solid #dceaf3;border-radius:26px;padding:40px;box-shadow:0 30px 70px #123b581b}.authbox .brand{margin-bottom:38px}.authbox h1{font-size:32px;margin:0 0 8px}.authbox>p{color:#6a8295;margin-bottom:28px}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:700}.field input{width:100%;padding:15px;border:1px solid #cddde8;border-radius:11px;font:inherit;outline:none}.field input:focus{border-color:#0784ca;box-shadow:0 0 0 3px #0784ca12}.submit{width:100%;border:0;cursor:pointer;font-weight:700;font-size:14px;margin-top:10px}.msg{min-height:24px;font-size:13px;margin-top:14px;color:#c0392b}.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#0784ca}</style></head><body><main class="auth"><form class="authbox" id="loginForm"><a class="brand" href="/"><span class="mark">E+</span><span>EGE <b>Diagnostik</b></span></a><span class="eyebrow">TEK HESAP • DOĞRU PANEL</span><h1>Akıllı Giriş</h1><p>Yetkinize göre yönetim merkezi veya eğitim portalına otomatik yönlendirilirsiniz.</p><div class="field"><label>E-posta</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Parola</label><input name="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="primary submit" type="submit">Güvenli Giriş</button><div class="msg" id="msg"></div><a class="back" href="/">← Ana sayfaya dön</a></form></main><script>const f=document.querySelector('#loginForm'),m=document.querySelector('#msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Kontrol ediliyor…';const b=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw new Error(j.error==='temporarily_locked'?'Çok fazla deneme. Lütfen daha sonra tekrar deneyin.':'E-posta veya parola hatalı.');location.href=j.redirect}catch(x){m.textContent=x.message}})</script></body></html>
