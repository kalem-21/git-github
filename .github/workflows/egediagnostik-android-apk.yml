name: Build EgeDiagnostik Android APK

on:
  push:
    branches: [master]
    paths:
      - 'egediagnostik-mobile/**'
      - '.github/workflows/egediagnostik-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: egediagnostik-mobile
        run: gradle assembleDebug

      - name: Rename APK
        run: cp egediagnostik-mobile/app/build/outputs/apk/debug/app-debug.apk EgeDiagnostik-Mobile-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EgeDiagnostik-Mobile-APK
          path: EgeDiagnostik-Mobile-v1.1.0.apk
          retention-days: 30
