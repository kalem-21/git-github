name: EgeDiagnostik iOS TestFlight

on:
  workflow_dispatch:

jobs:
  archive-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare app icons
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="egediagnostik-ios/EgeDiagnostik/Assets.xcassets/AppIcon.appiconset"
          TMP_ICON="$RUNNER_TEMP/ege-icon.png"
          mkdir -p "$ICON_DIR"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          raw = Path('egediagnostik-mobile/app-icon.b64').read_text().strip()
          Path('${{ runner.temp }}/ege-icon.png').write_bytes(base64.b64decode(raw))
          PY
          make_icon() { sips -z "$1" "$1" "$TMP_ICON" --out "$ICON_DIR/$2" >/dev/null; }
          make_icon 40 Icon-20@2x.png
          make_icon 60 Icon-20@3x.png
          make_icon 58 Icon-29@2x.png
          make_icon 87 Icon-29@3x.png
          make_icon 80 Icon-40@2x.png
          make_icon 120 Icon-40@3x.png
          make_icon 120 Icon-60@2x.png
          make_icon 180 Icon-60@3x.png
          make_icon 20 Icon-20.png
          make_icon 40 Icon-20@2x-ipad.png
          make_icon 29 Icon-29.png
          make_icon 58 Icon-29@2x-ipad.png
          make_icon 40 Icon-40.png
          make_icon 80 Icon-40@2x-ipad.png
          make_icon 76 Icon-76.png
          make_icon 152 Icon-76@2x.png
          make_icon 167 Icon-83.5@2x.png
          make_icon 1024 Icon-1024.png

      - name: Create temporary keychain
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/egediagnostik.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profile
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/EgeDiagnostik.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive signed app
        working-directory: egediagnostik-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project EgeDiagnostik.xcodeproj \
            -scheme EgeDiagnostik \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EgeDiagnostik.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.egediagnostik.mobile</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EgeDiagnostik.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/"*.ipa EgeDiagnostik-iOS.ipa

      - name: Configure App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file EgeDiagnostik-iOS.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgeDiagnostik-iOS-IPA
          path: EgeDiagnostik-iOS.ipa
          retention-days: 30
