name: Build FULL PHP Server Package

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/build_full_php.py'
      - '.github/workflows/build-full-php.yml'
      - 'egediagnostik_web/**'

permissions:
  contents: write

jobs:
  build-full-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build FULL PHP package
        run: python3 .github/scripts/build_full_php.py

      - name: Commit generated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EGE_Diagnostik_FULL_PHP_Server.zip
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh FULL PHP server package [skip ci]"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGE_Diagnostik_FULL_PHP_Server
          path: EGE_Diagnostik_FULL_PHP_Server.zip
          retention-days: 30
